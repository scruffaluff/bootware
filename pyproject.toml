# Python configuration file for building, dependencies, and tooling.
#
# For more information, visit
# https://snarky.ca/what-the-heck-is-pyproject-toml.

[build-system]
build-backend = "uv_build"
requires = ["uv-build~=0.11"]

[dependency-groups]
dev = [
  "ansible~=14.2",
  "ansible-compat~=26.6",
  "ansible-lint~=26.6;sys_platform!='windows'",
  "pytest~=9.1",
  "ruff~=0.16.0",
  "ty~=0.0.72",
  "yamllint~=1.38",
]

[project]
authors = [
  { name = "Macklan Weinstein", email = "macklan.weinstein@gmail.com" },
]
description = "Ansible collection for bootstrapping software installations."
homepage = "https://github.com/scruffaluff/bootware"
keywords = []
license = "MIT"
name = "bootware"
readme = "README.md"
requires-python = ">=3.12.0,<4.0.0"
version = "0.10.4"

[tool.pytest.ini_options]
addopts = "-sv"
cache_dir = ".vendor/cache/pytest"
markers = ["e2e: mark as end to end test.", "unit: mark as unit test."]
testpaths = ["test"]

[tool.ruff]
cache-dir = ".vendor/cache/ruff"
extend-exclude = ["jupyter_notebook_config.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
flake8-annotations = { allow-star-arg-any = true }
ignore = [
  "COM", # Flake8 comma lints conflict with formatter.
  "CPY001", # Copyright notices are not required.
  "DOC201", # Not all docstrings should require a returns section.
  "E731", # Lambda statements sometimes increase readability.
  "EXE003", # Uv should be shebang executor.
  "FBT", # Boolean function arguments are acceptable.
  "FIX", # Todo comments are acceptable.
  "ICN", # Import abbreviations reduce readability.
  "INP001", # Project hooks directory is not a package.
  "PLR2004", # Constant numerical comparisons are often readable.
  "RUF201", # Ruff rule codes in configuration files are readable.
  "RUF067", # Init modules should allow code designed for export.
  "S101", # Assert statements are standard for test functions.
  "S603", # Subprocess commands are acceptable.
  "S607", # Partial paths for process executables is more cross platform.
  "SIM105", # Try except pass blocks are faster than contextlib supress.
  "T201", # Print statements are acceptable for CLI applications.
  "T203", # Print statements are acceptable for CLI applications.
  "TD", # Todo formatting is excessive for personal projects.
]
isort = { known-first-party = ["lldbrc", "pdbrc", "plotrc", "pyrc"] }
pydocstyle = { convention = "google" }
select = ["ALL"]

[tool.ty.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unused-ignore-comment = "error"

[tool.ty.src]
exclude = [
  '\.benchmarks/',
  '\.cache/',
  '\.hypothesis/',
  '\.pytest_cache/',
  '\.ruff_cache/',
  '\.vendor/',
  '\.venv/',
  'tmp/',
  'jupyter_notebook_config.py',
]

[tool.ty.terminal]
error-on-warning = true

[tool.uv]
package = false
