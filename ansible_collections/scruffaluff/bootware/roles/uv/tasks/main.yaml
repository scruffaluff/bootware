---
- name: Create Uv temporary directory for Unix
  ansible.builtin.tempfile:
    state: directory
  register: uv_temp
  tags:
    - completion
    - install
  when: ansible_facts.system != "Win32NT"

- name: Set Uv temporary directory permissions for Unix
  ansible.builtin.file:
    mode: "755"
    path: "{{ uv_temp.path }}"
    state: directory
  tags:
    - completion
    - install
  when: ansible_facts.system != "Win32NT"

- name: Install Uv for FreeBSD
  become: true
  community.general.pkgng:
    name: uv
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "FreeBSD"

- name: Get latest Uv version for Linux
  ansible.builtin.uri:
    method: GET
    return_content: true
    url: https://formulae.brew.sh/api/formula/uv.json
  register: uv_formula
  tags:
    - install
  when: ansible_facts.system == "Linux"

- name: Download Uv for Linux
  ansible.builtin.unarchive:
    dest: "{{ uv_temp.path }}"
    mode: "777"
    remote_src: true
    src: >-
      https://github.com/astral-sh/uv/releases/download/{{
      uv_formula.json.versions.stable }}/uv-{{ uv_arch }}-unknown-linux-{{
      uv_libc }}.tar.gz
  tags:
    - install
  when: ansible_facts.system == "Linux"

- name: Install Uv for Linux
  ansible.builtin.copy:
    dest: "{{ bin_path }}/uv"
    force: true
    mode: "755"
    remote_src: true
    src: "{{ uv_temp.path }}/uv-{{ uv_arch }}-unknown-linux-{{ uv_libc }}/uv"
  become: "{{ system_install }}"
  tags:
    - install
  when: ansible_facts.system == "Linux"

- name: Install Uv for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user }}"
  community.general.homebrew:
    name: uv
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install Uv for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name: uv
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Override Scoop custom Uv settings for Windows
  ansible.windows.win_environment:
    level: user
    name: "{{ item.name }}"
    value: "{{ user_home }}\\AppData\\Local\\uv\\{{ item.value }}"
  loop:
    - name: UV_CACHE_DIR
      value: cache
    - name: UV_PYTHON_BIN_DIR
      value: python\shims
    - name: UV_PYTHON_INSTALL_DIR
      value: python\versions
    - name: UV_TOOL_BIN_DIR
      value: tool\shims
    - name: UV_TOOL_DIR
      value: tool\versions
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Register Python files as executables for Windows
  ansible.windows.win_regedit:
    data: "{{ item.data }}"
    path: "{{ item.path }}"
    type: string
  loop:
    - data: pyfile
      path: "HKLM:\\Software\\Classes\\.py"
    - data: >-
        "{{ scoop_path }}\shims\uv.exe" --no-config --quiet run --script "%1" %*
      path: "HKLM:\\Software\\Classes\\pyfile\\shell\\open\\command"
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

# Since ansible_facts.env.Path is fixed on play connection, using
# ansible.windows.win_environment for PATHEXT in other roles will overwrite
# changes made here. Thus ansible.windows.win_environment cannot be used to
# extend PATHEXT.
- name: Add Python files to system path for Windows
  ansible.windows.win_shell: |
    $PathExt = [Environment]::GetEnvironmentVariable('PATHEXT', 'Machine')
    If (-Not ($PathExt -Like "*.PY*")) {
      [System.Environment]::SetEnvironmentVariable(
        'PATHEXT', "$PathExt;.PY", 'Machine'
      )
      Write-Output 'PATHEXT updated'
    }
  changed_when: "'PATHEXT updated' in uv_pathext.stdout"
  register: uv_pathext
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Add Uv shims to path for Windows
  ansible.windows.win_path:
    elements: "{{ user_home }}\\AppData\\Local\\uv\\tool\\shims"
    scope: user
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Create Uv shell completions for Unix
  ansible.builtin.shell:
    cmd:
      uv --generate-shell-completion {{ item }} > {{ uv_temp.path }}/uv.{{ item
      }}
  changed_when: true
  environment:
    PATH: "{{ env_path }}"
  loop:
    - bash
    - fish
    - nushell
  tags:
    - completion
    - install
  when: ansible_facts.system != "Win32NT"

- name: Install Uv shell completions for Unix
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    force: true
    mode: "644"
    remote_src: true
    src: "{{ uv_temp.path }}/uv.{{ item.shell }}"
  become: "{{ system_install }}"
  loop:
    - dest: "{{ bash_completion }}/uv"
      shell: bash
    - dest: "{{ fish_completion }}/uv.fish"
      shell: fish
    - dest: "{{ nushell_autoload }}/uv.nu"
      shell: nushell
  tags:
    - completion
    - install
  when: ansible_facts.system != "Win32NT"

- name: Create Uv Nushell shell completions for Windows
  # Using "WriteAllLines" to avoid the Byte Order Mark (BOM) that PowerShell 5
  # prepends to outputs redirected to files.
  ansible.windows.win_shell: |
    $Text = uv --generate-shell-completion nushell
    [System.IO.File]::WriteAllLines("{{ nushell_autoload }}/uv.nu", $Text)
  changed_when: true
  environment:
    Path: "{{ env_path }}"
  tags:
    - completion
    - install
  when: ansible_facts.system == "Win32NT"

- name: Create Uv PowerShell completions for Windows
  # Using "WriteAllLines" to avoid the Byte Order Mark (BOM) that PowerShell 5
  # prepends to outputs redirected to files.
  ansible.windows.win_shell: |
    $Text = uv --generate-shell-completion powershell
    [System.IO.File]::WriteAllLines("{{ item }}/UvCompletion.psm1", $Text)
  changed_when: true
  environment:
    Path: "{{ env_path }}"
  loop: "{{ powershell_module }}"
  tags:
    - completion
    - install
  when: ansible_facts.system == "Win32NT"

- name: Remove Uv temporary directory for Unix
  ansible.builtin.file:
    path: "{{ uv_temp.path }}"
    state: absent
  tags:
    - completion
    - install
  when: ansible_facts.system != "Win32NT"
