---
- name: Create keyring directory for Debian
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  tags:
    - install

- name: Download Mozilla GPG key for Debian
  ansible.builtin.get_url:
    dest: /etc/apt/keyrings/mozilla.asc
    force: true
    mode: "0644"
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
  become: true
  tags:
    - install

- name: Add Mozilla repository for Debian
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/mozilla.asc]
      https://packages.mozilla.org/apt mozilla main
    state: present
    filename: mozilla
  become: true
  tags:
    - install

- name: Prioritize Mozilla repository for Debian
  ansible.builtin.copy:
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    dest: /etc/apt/preferences.d/mozilla
    force: true
    mode: "644"
  become: true
  tags:
    - install

- name: Install Firefox for Debian
  ansible.builtin.apt:
    name: firefox
  become: true
  tags:
    - install
