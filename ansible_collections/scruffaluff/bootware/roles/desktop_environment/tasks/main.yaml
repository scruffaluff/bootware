---
- name: Install desktop management dependencies for FreeBSD
  become: true
  community.general.pkgng:
    name:
      - dconf-editor
      - xdg-utils
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "FreeBSD"
    - gnome_desktop

- name: Install desktop management dependencies for Linux
  ansible.builtin.package:
    name:
      - dconf-editor
      - xdg-utils
  become: true
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "Linux"
    - gnome_desktop

- name: Add clipboard commands for Linux
  ansible.builtin.package:
    name: wl-clipboard
  become: true
  failed_when: false
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "Linux"

- name: Install desktop management dependencies for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user }}"
  community.general.homebrew:
    name: duti
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install desktop management dependencies for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name: powertoys
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Create desktop feature flags directory for MacOS
  ansible.builtin.file:
    mode: "755"
    path: /Library/Preferences/FeatureFlags/Domain
    state: directory
  become: true
  tags:
    - config
  when:
    - system_install
    - ansible_facts.system == "Darwin"

# Requires system restart for flags to take effect.
- name: Set desktop feature flags for MacOS
  ansible.builtin.command:
    cmd: /usr/libexec/PlistBuddy -c "{{ item.command }}" "{{ item.path }}"
  become: true
  changed_when: >-
    'Entry Already Exists' not in desktop_feature_flags_macos.stderr
  failed_when:
    - desktop_feature_flags_macos.rc != 0
    - "'Entry Already Exists' not in desktop_feature_flags_macos.stderr"
  register: desktop_feature_flags_macos
  loop:
    # Remove blue caps lock indicator.
    - command: Add redesigned_text_cursor:Enabled bool false
      path: /Library/Preferences/FeatureFlags/Domain/UIKit.plist
    # Remove Write With Siri blue button.
    - command: Add LightweightUI_macOS:Enabled bool false
      path: /Library/Preferences/FeatureFlags/Domain/WritingTools.plist
  tags:
    - config
  when:
    - system_install
    - ansible_facts.system == "Darwin"

- name: Create keyboard layout directory for MacOS
  ansible.builtin.file:
    group: "{{ group_id }}"
    mode: "700"
    owner: "{{ user_id }}"
    path: "{{ user_home }}/Library/Keyboard Layouts"
    state: directory
  become: "{{ system_install }}"
  tags:
    - config
  when: ansible_facts.system == "Darwin"

# Custom keyboard layout disable special "alt" characters that interfere with
# "alt" keybindings. Solution was taken from
# https://stackoverflow.com/a/16019737.
- name: Copy keyboard layout for MacOS
  ansible.builtin.copy:
    dest: "{{ user_home }}/Library/Keyboard Layouts/no_alt_characters.keylayout"
    force: true
    group: "{{ group_id }}"
    mode: "640"
    owner: "{{ user_id }}"
    src: no_alt_characters.keylayout
  become: "{{ system_install }}"
  tags:
    - config
  when: ansible_facts.system == "Darwin"

- name: Install GNOME extensions for GNOME desktops
  ansible.builtin.include_tasks:
    file: gnome_extension.yaml
  loop: "{{ gnome_extensions }}"
  loop_control:
    loop_var: gnome_extension
  tags:
    - install
  when:
    - ansible_facts.system in ["FreeBSD", "Linux"]
    - gnome_desktop

- name: Change desktop settings for GNOME desktops
  ansible.builtin.script: gnome.sh
  become: "{{ system_install }}"
  become_user: "{{ user_id }}"
  environment:
    BOOTWARE_FONT_SIZE: "{{ system_font_size }}"
  tags:
    - config
  when:
    - ansible_facts.system in ["FreeBSD", "Linux"]
    - gnome_desktop

- name: Change desktop settings for MacOS
  ansible.builtin.script: macos.sh
  become: "{{ system_install }}"
  become_user: "{{ user_id }}"
  tags:
    - config
  when: ansible_facts.system == "Darwin"

- name: Change desktop settings for Windows
  ansible.builtin.script: windows.ps1
  tags:
    - config
  when: ansible_facts.system == "Win32NT"

- name: Create PowerToys keyboard directory for Windows
  ansible.windows.win_file:
    path: >-
      {{ user_home }}\AppData\Local\Microsoft\PowerToys\Keyboard Manager
    state: directory
  tags:
    - config
  when: ansible_facts.system == "Win32NT"

- name: Copy PowerToys keyboard files for Windows
  ansible.windows.win_copy:
    dest: >-
      {{ user_home }}\AppData\Local\Microsoft\PowerToys\Keyboard
      Manager\settings.json
    force: true
    src: keyboard_manager.json
  tags:
    - config
  when: ansible_facts.system == "Win32NT"

- name: Set owner of PowerToys files for Windows
  ansible.windows.win_owner:
    path: "{{ user_home }}\\AppData\\Local\\Microsoft\\PowerToys"
    recurse: true
    user: "{{ user_id }}"
  tags:
    - config
  when: ansible_facts.system == "Win32NT"
