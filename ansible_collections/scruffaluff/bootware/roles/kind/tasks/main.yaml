---
- name: Get latest Kind version for Linux
  ansible.builtin.uri:
    method: GET
    return_content: true
    url: https://formulae.brew.sh/api/formula/kind.json
  register: kind_formula
  tags:
    - install
  when: ansible_facts.system == "Linux"

- name: Install Kind for Linux
  ansible.builtin.get_url:
    dest: "{{ bin_path }}/kind"
    force: true
    mode: "755"
    url: >-
      https://github.com/kubernetes-sigs/kind/releases/download/v{{
      kind_formula.json.versions.stable }}/kind-linux-{{ system_architecture }}
  become: "{{ system_install }}"
  tags:
    - install
  when: ansible_facts.system == "Linux"

- name: Install Kind for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user }}"
  community.general.homebrew:
    name: kind
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install Kind for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name: kind
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Create Kind temporary directory for Unix
  ansible.builtin.tempfile:
    state: directory
  register: kind_temp
  tags:
    - install
  when: ansible_facts.system in ["Darwin", "Linux"]

- name: Create Kind shell completions for Unix
  ansible.builtin.shell: >-
    kind completion {{ item }} > {{ kind_temp.path }}/kind.{{ item }}
  changed_when: true
  environment:
    PATH: /opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}
  loop:
    - bash
    - fish
  tags:
    - completion
    - install
  when: ansible_facts.system in ["Darwin", "Linux"]

- name: Install Kind shell completions for Unix
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    force: true
    mode: "644"
    remote_src: true
    src: "{{ kind_temp.path }}/kind.{{ item.shell }}"
  become: true
  loop:
    - dest: "{{ bash_completion }}/kind"
      shell: bash
    - dest: "{{ fish_completion }}/kind.fish"
      shell: fish
  tags:
    - completion
    - install
  when: ansible_facts.system in ["Darwin", "Linux"]

- name: Remove Kind temporary directory for Unix
  ansible.builtin.file:
    path: "{{ kind_temp.path }}"
    state: absent
  tags:
    - install
  when: ansible_facts.system in ["Darwin", "Linux"]
