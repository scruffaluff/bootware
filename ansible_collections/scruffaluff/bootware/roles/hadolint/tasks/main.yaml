---
- name: Install Hadolint for FreeBSD
  become: true
  community.general.pkgng:
    name: hs-hadolint
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "FreeBSD"

- name: Install Hadolint for Linux
  ansible.builtin.package:
    name: hadolint
  become: true
  ignore_errors: true
  register: hadolint_linux
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "Linux"

- name: Get latest Hadolint version for Linux
  ansible.builtin.uri:
    method: GET
    return_content: true
    url: https://formulae.brew.sh/api/formula/hadolint.json
  register: hadolint_formula
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or hadolint_linux is failed

- name: Install Hadolint for Linux
  ansible.builtin.get_url:
    dest: "{{ bin_path }}/hadolint"
    force: true
    mode: "755"
    url: >-
      https://github.com/hadolint/hadolint/releases/download/v{{
      hadolint_formula.json.versions.stable }}/hadolint-Linux-{{
      hadolint_arch[system_architecture] }}
  become: "{{ system_install }}"
  tags:
    - install
  vars:
    hadolint_arch:
      amd64: x86_64
      arm64: arm64
  when:
    - ansible_facts.system == "Linux"
    - not system_install or hadolint_linux is failed

- name: Install Hadolint for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user if system_install else omit }}"
  community.general.homebrew:
    name: hadolint
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install Hadolint for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name: hadolint
  tags:
    - install
  when: ansible_facts.system == "Win32NT"
