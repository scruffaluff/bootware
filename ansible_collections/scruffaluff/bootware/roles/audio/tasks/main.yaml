---
- name: Install audio packages for Alpine
  become: true
  community.general.apk:
    name:
      - alsa-lib
      - alsa-utils
      - mediainfo
      - mpv
      - sox
  tags:
    - install
  when:
    - system_install
    - system_pkg_mgr == "apk"

- name: Install audio packages for Arch
  become: true
  community.general.pacman:
    name:
      - alsa-lib
      - alsa-utils
      - mediainfo
      - mpv
      - sox
  tags:
    - install
  when:
    - system_install
    - system_pkg_mgr == "pacman"

- name: Install audio packages for Debian
  ansible.builtin.apt:
    name:
      - alsa-utils
      - libasound2-dev
      - mediainfo
      - mpv
      - sox
  become: true
  tags:
    - install
  when:
    - system_install
    - system_pkg_mgr == "apt"

- name: Install audio packages for Fedora
  ansible.builtin.dnf:
    name:
      - alsa-lib
      - alsa-utils
      - mediainfo
      - mpv
      - sox
  become: true
  tags:
    - install
  when:
    - system_install
    - system_pkg_mgr == "dnf"

- name: Install audio packages for FreeBSD
  become: true
  community.general.pkgng:
    name:
      - alsa-lib
      - alsa-utils
      - mediainfo
      - mpv
      - sox
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "FreeBSD"

- name: Install audio packages for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user if system_install else omit }}"
  community.general.homebrew:
    name:
      - media-info
      - mpv
      - sox
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install audio packages for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name:
      - mediainfo
      - mpv
      - sox
  tags:
    - install
  when: ansible_facts.system == "Win32NT"
