---
- name: Install Dive for FreeBSD
  become: true
  community.general.pkgng:
    name: dive
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "FreeBSD"

- name: Install Dive for Linux
  ansible.builtin.package:
    name: dive
  become: true
  ignore_errors: true
  register: dive_linux
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "Linux"

- name: Get latest Dive version for Linux
  ansible.builtin.uri:
    method: GET
    return_content: true
    url: https://formulae.brew.sh/api/formula/dive.json
  register: dive_formula
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or dive_linux is failed

- name: Create Dive temporary directory for Linux
  ansible.builtin.tempfile:
    state: directory
  register: dive_temp
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or dive_linux is failed

- name: Set Dive temporary directory permissions for Linux
  ansible.builtin.file:
    mode: "755"
    path: "{{ dive_temp.path }}"
    state: directory
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or dive_linux is failed

- name: Download Dive for Linux
  ansible.builtin.unarchive:
    dest: "{{ dive_temp.path }}"
    mode: "777"
    remote_src: true
    src: >-
      https://github.com/wagoodman/dive/releases/download/v{{
      dive_formula.json.versions.stable }}/dive_{{
      dive_formula.json.versions.stable }}_linux_{{ system_architecture
      }}.tar.gz
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or dive_linux is failed

- name: Install Dive for Linux
  ansible.builtin.copy:
    dest: "{{ bin_path }}/dive"
    force: true
    mode: "755"
    remote_src: true
    src: "{{ dive_temp.path }}/dive"
  become: "{{ system_install }}"
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or dive_linux is failed

- name: Install Dive for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user if system_install else omit }}"
  community.general.homebrew:
    name: dive
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install Dive for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name: dive
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Remove Dive temporary directory for Linux
  ansible.builtin.file:
    path: "{{ dive_temp.path }}"
    state: absent
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - not system_install or dive_linux is failed
