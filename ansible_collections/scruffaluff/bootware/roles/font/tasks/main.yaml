---
- name: Install fonts for Unix
  ansible.builtin.include_tasks:
    file: unix.yaml
  loop: "{{ font_families }}"
  loop_control:
    loop_var: font_family
  tags:
    - install
  vars:
    font_folder:
      FreeBSD: >-
        {{ '/usr/local/share/fonts/' if system_install else user_home +
        '/.local/share/fonts' }}
      Darwin: "{{ '' if system_install else user_home }}/Library/Fonts"
      Linux: >-
        {{ '/usr/share/fonts/' if system_install else user_home +
        '/.local/share/fonts' }}
  when:
    - ansible_facts.system != "Win32NT"
    - font_install

- name: Install fonts for Windows
  ansible.builtin.include_tasks:
    file: windows.yaml
  loop: "{{ font_families }}"
  loop_control:
    loop_var: font_family
  tags:
    - install
  vars:
    font_folder: >-
      {{ 'C:\Windows\Fonts' if system_install else user_home +
      '\AppData\Local\Microsoft\Windows\Fonts' }}
  when:
    - ansible_facts.system == "Win32NT"
    - font_install

- name: Mark role as executed to prevent reruns
  ansible.builtin.set_fact:
    cacheable: true
    font_role_executed: true
