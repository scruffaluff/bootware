---
- name: Install Glow for Alpine
  become: true
  community.general.apk:
    name: glow
    repository: http://dl-cdn.alpinelinux.org/alpine/edge/testing
    state: latest
    update_cache: true
  tags:
    - install
  when:
    - system_pkg_mgr == "apk"
    - system_install

- name: Install Glow for FreeBSD
  become: true
  community.general.pkgng:
    name: glow
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "FreeBSD"

- name: Install Glow for Linux
  ansible.builtin.package:
    name: glow
  become: true
  ignore_errors: true
  register: glow_linux
  tags:
    - install
  when:
    - system_install
    - ansible_facts.system == "Linux"
    - system_pkg_mgr != "apk"

- name: Get latest Glow version for Linux
  ansible.builtin.uri:
    method: GET
    return_content: true
    url: https://formulae.brew.sh/api/formula/glow.json
  register: glow_formula
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - system_pkg_mgr != "apk"
    - not system_install or glow_linux is failed

- name: Create Glow temporary directory for Linux
  ansible.builtin.tempfile:
    state: directory
  register: glow_temp
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - system_pkg_mgr != "apk"
    - not system_install or glow_linux is failed

- name: Download Glow for Linux
  ansible.builtin.unarchive:
    dest: "{{ glow_temp.path }}"
    mode: "755"
    remote_src: true
    src: >-
      https://github.com/charmbracelet/glow/releases/download/v{{
      glow_formula.json.versions.stable }}/glow_{{
      glow_formula.json.versions.stable }}_Linux_{{ glow_arch }}.tar.gz
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - system_pkg_mgr != "apk"
    - not system_install or glow_linux is failed

- name: Install Glow for Linux
  ansible.builtin.copy:
    dest: "{{ bin_path }}/glow"
    force: true
    mode: "755"
    remote_src: true
    src: >-
      {{ glow_temp.path }}/glow_{{ glow_formula.json.versions.stable }}_Linux_{{
      glow_arch }}/glow
  become: "{{ system_install }}"
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - system_pkg_mgr != "apk"
    - not system_install or glow_linux is failed

- name: Install Glow for MacOS
  become: "{{ system_install }}"
  become_user: "{{ brew_user if system_install else omit }}"
  community.general.homebrew:
    name: glow
  tags:
    - install
  when: ansible_facts.system == "Darwin"

- name: Install Glow for Windows
  community.windows.win_scoop:
    global: "{{ system_install }}"
    name: glow
  tags:
    - install
  when: ansible_facts.system == "Win32NT"

- name: Create Glow settings directory for MacOS
  ansible.builtin.file:
    dest: "{{ user_home }}/Library/Preferences/glow"
    group: "{{ group_id if system_install else omit }}"
    mode: "755"
    owner: "{{ user_id if system_install else omit }}"
    state: directory
  become: "{{ system_install }}"
  tags:
    - config
  when: ansible_facts.system == "Darwin"

- name: Copy Glow settings file for MacOS
  ansible.builtin.copy:
    dest: "{{ user_home }}/Library/Preferences/glow/glow.yaml"
    force: true
    group: "{{ group_id if system_install else omit }}"
    mode: "644"
    owner: "{{ user_id if system_install else omit }}"
    src: glow.yaml
  become: "{{ system_install }}"
  tags:
    - config
  when: ansible_facts.system == "Darwin"

- name: Create Glow settings directory for Unix
  ansible.builtin.file:
    group: "{{ group_id if system_install else omit }}"
    mode: "755"
    owner: "{{ user_id if system_install else omit }}"
    path: "{{ user_home }}/.config/glow"
    state: directory
  become: "{{ system_install }}"
  tags:
    - config
  when: ansible_facts.system not in ["Darwin", "Win32NT"]

- name: Copy Glow settings file for Unix
  ansible.builtin.copy:
    dest: "{{ user_home }}/.config/glow/glow.yaml"
    force: true
    group: "{{ group_id if system_install else omit }}"
    mode: "644"
    owner: "{{ user_id if system_install else omit }}"
    src: glow.yaml
  become: "{{ system_install }}"
  tags:
    - config
  when: ansible_facts.system not in ["Darwin", "Win32NT"]

- name: Create Glow settings directory for Windows
  ansible.windows.win_file:
    path: "{{ user_home }}\\AppData\\Local\\glow\\config"
    state: directory
  tags:
    - config
  when: ansible_facts.system == "Win32NT"

- name: Copy Glow settings file for Windows
  ansible.windows.win_copy:
    dest: "{{ user_home }}\\AppData\\Local\\glow\\config\\glow.yaml"
    force: true
    src: glow.yaml
  tags:
    - config
  when: ansible_facts.system == "Win32NT"

- name: Set owner of Glow files for Windows
  ansible.windows.win_owner:
    path: "{{ user_home }}\\AppData\\Local\\glow"
    recurse: true
    user: "{{ user_id }}"
  tags:
    - config
  when: ansible_facts.system == "Win32NT"

- name: Remove Glow temporary directory for Linux
  ansible.builtin.file:
    path: "{{ glow_temp.path }}"
    state: absent
  tags:
    - install
  when:
    - ansible_facts.system == "Linux"
    - system_pkg_mgr != "apk"
    - not system_install or glow_linux is failed
